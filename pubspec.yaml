name: quick_notes
description: "A dark-themed collaborative notes and file storage application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Rich Text Editor
  flutter_quill: ^10.8.4

  # File Handling
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # UI
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.0
  intl: ^0.19.0
  mime: ^1.0.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
